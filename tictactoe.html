<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐧 vs 🐢 Tic-Tac-Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 { font-size: 2rem; margin-bottom: 8px; color: #e0e0ff; }

    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
      background: #16213e;
      padding: 14px 24px;
      border-radius: 12px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label { font-size: 0.9rem; color: #aab; }

    input[type="number"] {
      width: 60px;
      padding: 6px 8px;
      border: 1px solid #334;
      border-radius: 6px;
      background: #0f3460;
      color: #eee;
      font-size: 1rem;
      text-align: center;
    }

    button {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    #startBtn { background: #e94560; color: #fff; }
    #startBtn:hover { background: #c73652; }

    .status {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 16px;
      min-height: 1.8em;
      color: #cce;
      transition: color 0.2s;
    }

    .status.p-turn  { color: #7ec8e3; }
    .status.t-turn  { color: #6fcf97; }
    .status.p-wins  { color: #7ec8e3; }
    .status.t-wins  { color: #6fcf97; }
    .status.draw    { color: #aaa; }

    .board-wrapper { overflow: auto; max-width: 100vw; }

    .board {
      display: grid;
      gap: 4px;
      padding: 4px;
      background: #0f3460;
      border-radius: 12px;
      user-select: none;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      background: #16213e;
      transition: background 0.12s, transform 0.1s;
      line-height: 1;
    }

    .cell:hover:not(.taken) { background: #1f2f5a; transform: scale(1.05); }
    .cell.taken { cursor: default; }

    @keyframes pop-in {
      0%   { transform: scale(0.3) rotate(-15deg); opacity: 0; }
      60%  { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .cell.just-placed { animation: pop-in 0.25s ease-out forwards; }

    @keyframes celebrate {
      0%, 100% { transform: scale(1) rotate(0deg); }
      20%  { transform: scale(1.3) rotate(-8deg); }
      40%  { transform: scale(1.3) rotate(8deg); }
      60%  { transform: scale(1.2) rotate(-5deg); }
      80%  { transform: scale(1.2) rotate(5deg); }
    }

    .cell.winning {
      background: #1c3b2e;
      animation: celebrate 0.6s ease-in-out infinite alternate;
    }

    .confetti-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 999;
    }

    @keyframes confetti-fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confetti-fall linear forwards;
    }

    .score-board {
      display: flex;
      gap: 32px;
      margin-top: 20px;
      background: #16213e;
      padding: 12px 28px;
      border-radius: 12px;
    }

    .score-item { text-align: center; }
    .score-label { font-size: 0.8rem; color: #aab; text-transform: uppercase; letter-spacing: 1px; }
    .score-value { font-size: 1.8rem; font-weight: 700; }
    .score-item.p .score-value { color: #7ec8e3; }
    .score-item.t .score-value { color: #6fcf97; }
    .score-item.draw-score .score-value { color: #aaa; }
  </style>
</head>
<body>
  <h1>🐧 vs 🐢</h1>

  <div class="controls">
    <div class="control-group">
      <label for="gridSize">Grid size</label>
      <input type="number" id="gridSize" min="3" max="20" value="5">
    </div>
    <div class="control-group">
      <label for="winLen">Win streak</label>
      <input type="number" id="winLen" min="3" max="20" value="4">
    </div>
    <button id="startBtn">New Game</button>
  </div>

  <div class="status" id="status">Press "New Game" to start</div>

  <div class="board-wrapper">
    <div class="board" id="board"></div>
  </div>

  <div class="score-board">
    <div class="score-item p">
      <div class="score-label">🐧 Penguin</div>
      <div class="score-value" id="scoreP">0</div>
    </div>
    <div class="score-item draw-score">
      <div class="score-label">Draws</div>
      <div class="score-value" id="scoreD">0</div>
    </div>
    <div class="score-item t">
      <div class="score-label">🐢 Turtle</div>
      <div class="score-value" id="scoreT">0</div>
    </div>
  </div>

  <div class="confetti-container" id="confetti"></div>

  <script>
    const boardEl  = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const gridIn   = document.getElementById('gridSize');
    const winIn    = document.getElementById('winLen');
    const scorePEl = document.getElementById('scoreP');
    const scoreTEl = document.getElementById('scoreT');
    const scoreDEl = document.getElementById('scoreD');
    const confettiEl = document.getElementById('confetti');

    const PLAYERS = { P: '🐧', T: '🐢' };
    let size, winLen, cells, currentPlayer, gameOver;
    let scores = { P: 0, T: 0, D: 0 };

    // ── Audio ──────────────────────────────────────────────────────────────
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playTone(freq, type, duration, gainVal, startTime, ctx) {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(gainVal, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    function soundPenguin() {
      const ctx = getAudio();
      const t = ctx.currentTime;
      // chirpy double-beep
      playTone(1046, 'sine', 0.12, 0.4, t,        ctx);
      playTone(1318, 'sine', 0.10, 0.3, t + 0.13, ctx);
    }

    function soundTurtle() {
      const ctx = getAudio();
      const t = ctx.currentTime;
      // low hollow plonk
      playTone(196, 'triangle', 0.18, 0.5, t,        ctx);
      playTone(130, 'triangle', 0.14, 0.3, t + 0.06, ctx);
    }

    function soundWin(isPenguin) {
      const ctx = getAudio();
      const t = ctx.currentTime;
      const base = isPenguin ? 523 : 196;
      // ascending fanfare
      const notes = [1, 5/4, 3/2, 2, 8/3];
      notes.forEach((ratio, i) => {
        playTone(base * ratio, isPenguin ? 'sine' : 'triangle', 0.25, 0.4, t + i * 0.14, ctx);
      });
    }

    function soundDraw() {
      const ctx = getAudio();
      const t = ctx.currentTime;
      [440, 370, 311].forEach((f, i) => {
        playTone(f, 'sawtooth', 0.2, 0.2, t + i * 0.15, ctx);
      });
    }

    // ── Confetti ───────────────────────────────────────────────────────────
    const CONFETTI_COLORS = ['#7ec8e3','#6fcf97','#f4a261','#e94560','#ffe066','#c8b1e4'];

    function launchConfetti() {
      confettiEl.innerHTML = '';
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        const left  = Math.random() * 100;
        const delay = Math.random() * 0.6;
        const dur   = 1.5 + Math.random() * 1.5;
        const size  = 6 + Math.random() * 10;
        piece.style.cssText = `
          left: ${left}vw;
          width: ${size}px;
          height: ${size}px;
          background: ${color};
          animation-duration: ${dur}s;
          animation-delay: ${delay}s;
          border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
        `;
        confettiEl.appendChild(piece);
      }
      setTimeout(() => { confettiEl.innerHTML = ''; }, 3500);
    }

    // ── Game logic ─────────────────────────────────────────────────────────
    startBtn.addEventListener('click', startGame);

    function startGame() {
      size = Math.min(20, Math.max(3, parseInt(gridIn.value) || 5));
      winLen = Math.min(size, Math.max(3, parseInt(winIn.value) || 4));
      gridIn.value = size;
      winIn.value  = winLen;

      cells = Array(size * size).fill(null);
      currentPlayer = 'P';
      gameOver = false;
      confettiEl.innerHTML = '';

      renderBoard();
      setStatus(`🐧 Penguin's turn`, 'p-turn');
    }

    function renderBoard() {
      const cellPx   = Math.max(32, Math.min(72, Math.floor(560 / size)));
      const fontSize = Math.round(cellPx * 0.58);

      boardEl.style.gridTemplateColumns = `repeat(${size}, ${cellPx}px)`;
      boardEl.innerHTML = '';

      cells.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.className = 'cell' + (val ? ` ${val.toLowerCase()} taken` : '');
        cell.style.width    = `${cellPx}px`;
        cell.style.height   = `${cellPx}px`;
        cell.style.fontSize = `${fontSize}px`;
        cell.textContent    = val ? PLAYERS[val] : '';
        cell.dataset.idx    = idx;
        cell.addEventListener('click', onCellClick);
        boardEl.appendChild(cell);
      });
    }

    function onCellClick(e) {
      if (gameOver) return;
      const idx = parseInt(e.currentTarget.dataset.idx);
      if (cells[idx]) return;

      cells[idx] = currentPlayer;
      const cellEl = boardEl.children[idx];
      cellEl.textContent = PLAYERS[currentPlayer];
      cellEl.classList.add(currentPlayer.toLowerCase(), 'taken', 'just-placed');
      cellEl.addEventListener('animationend', () => cellEl.classList.remove('just-placed'), { once: true });

      // Play move sound
      if (currentPlayer === 'P') soundPenguin(); else soundTurtle();

      const winning = getWinningLine(idx);
      if (winning) {
        winning.forEach(i => boardEl.children[i].classList.add('winning'));
        const isPenguin = currentPlayer === 'P';
        setStatus(`${PLAYERS[currentPlayer]} ${isPenguin ? 'Penguin' : 'Turtle'} wins! 🎉`, isPenguin ? 'p-wins' : 't-wins');
        scores[currentPlayer]++;
        updateScores();
        soundWin(isPenguin);
        launchConfetti();
        gameOver = true;
        return;
      }

      if (cells.every(Boolean)) {
        setStatus('Draw! 🤝', 'draw');
        scores.D++;
        updateScores();
        soundDraw();
        gameOver = true;
        return;
      }

      currentPlayer = currentPlayer === 'P' ? 'T' : 'P';
      setStatus(`${PLAYERS[currentPlayer]} ${currentPlayer === 'P' ? "Penguin's" : "Turtle's"} turn`, currentPlayer === 'P' ? 'p-turn' : 't-turn');
    }

    function getWinningLine(lastIdx) {
      const row = Math.floor(lastIdx / size);
      const col = lastIdx % size;
      const p   = cells[lastIdx];

      const dirs = [[0,1],[1,0],[1,1],[1,-1]];
      for (const [dr, dc] of dirs) {
        const line = [lastIdx];
        for (const sign of [1, -1]) {
          let r = row + dr * sign, c = col + dc * sign;
          while (r >= 0 && r < size && c >= 0 && c < size && cells[r * size + c] === p) {
            line.push(r * size + c);
            r += dr * sign;
            c += dc * sign;
          }
        }
        if (line.length >= winLen) return line;
      }
      return null;
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className   = 'status ' + (cls || '');
    }

    function updateScores() {
      scorePEl.textContent = scores.P;
      scoreTEl.textContent = scores.T;
      scoreDEl.textContent = scores.D;
    }

    startGame();
  </script>
</body>
</html>
