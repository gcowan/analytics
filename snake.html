<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
      touch-action: none;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 2.5rem);
      color: #4ecca3;
      margin-bottom: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #scoreboard {
      display: flex;
      gap: clamp(12px, 4vw, 40px);
      margin-bottom: 10px;
      font-size: clamp(0.65rem, 2.5vw, 1rem);
      letter-spacing: 2px;
    }

    #scoreboard span { color: #a0a0c0; }
    #scoreboard strong { color: #4ecca3; }

    #game-container {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(78, 204, 163, 0.3);
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(26, 26, 46, 0.88);
      border-radius: 4px;
    }

    #overlay h2 {
      font-size: clamp(1.2rem, 5vw, 2rem);
      color: #4ecca3;
      margin-bottom: 8px;
      letter-spacing: 3px;
    }

    #overlay p {
      color: #a0a0c0;
      margin-bottom: 24px;
      font-size: clamp(0.7rem, 2.5vw, 0.9rem);
      text-align: center;
      padding: 0 16px;
    }

    #start-btn {
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      padding: 12px 32px;
      font-size: clamp(0.85rem, 3vw, 1rem);
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    #start-btn:hover  { background: #38b892; transform: scale(1.05); }
    #start-btn:active { transform: scale(0.97); }

    #controls {
      margin-top: 10px;
      font-size: 0.7rem;
      color: #606080;
      letter-spacing: 1px;
    }

    /* ── D-pad ────────────────────────────────────────────────── */
    #dpad {
      display: none;
      margin-top: 16px;
      position: relative;
      width: 150px;
      height: 150px;
      flex-shrink: 0;
    }

    .dpad-btn {
      position: absolute;
      width: 46px;
      height: 46px;
      background: #1e2a4a;
      border: 2px solid #4ecca3;
      border-radius: 6px;
      color: #4ecca3;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }

    .dpad-btn:active { background: #2a3f6a; }

    #btn-up    { top: 0;    left: 50%; transform: translateX(-50%); }
    #btn-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
    #btn-left  { left: 0;   top: 50%;  transform: translateY(-50%); }
    #btn-right { right: 0;  top: 50%;  transform: translateY(-50%); }

    #btn-pause {
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.65rem;
      letter-spacing: 0;
      border-color: #606080;
      color: #606080;
      width: 38px;
      height: 38px;
    }

    @media (pointer: coarse) {
      #dpad     { display: flex; }
      #controls { display: none; }
    }
  </style>
</head>
<body>

<h1>Snake</h1>

<div id="scoreboard">
  <div><span>SCORE </span><strong id="score">0</strong></div>
  <div><span>BEST </span><strong id="high-score">0</strong></div>
  <div><span>LEVEL </span><strong id="level">1</strong></div>
</div>

<div id="game-container">
  <canvas id="canvas"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">SNAKE</h2>
    <p id="overlay-msg">Arrow keys or WASD to move</p>
    <button id="start-btn">PLAY</button>
  </div>
</div>

<div id="controls">ARROW KEYS / WASD &nbsp;|&nbsp; P = PAUSE</div>

<div id="dpad">
  <div class="dpad-btn" id="btn-up"    data-dir="up">▲</div>
  <div class="dpad-btn" id="btn-left"  data-dir="left">◀</div>
  <div class="dpad-btn" id="btn-pause">II</div>
  <div class="dpad-btn" id="btn-right" data-dir="right">▶</div>
  <div class="dpad-btn" id="btn-down"  data-dir="down">▼</div>
</div>

<!-- Game logic (pure, testable) — inlined so the file works standalone -->
<script>
(function (exports) {
  'use strict';
  function createState(cols, rows) {
    cols = cols || 25; rows = rows || 25;
    var cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
    return { cols: cols, rows: rows,
      snake: [{ x: cx, y: cy }, { x: cx-1, y: cy }, { x: cx-2, y: cy }],
      dir: { x:1, y:0 }, nextDir: { x:1, y:0 }, food: { x:2, y:2 },
      bonus: null, score: 0, level: 1, speed: 150,
      running: true, paused: false, justAte: false };
  }
  function onSnake(snake, pos) {
    return snake.some(function(s){ return s.x===pos.x && s.y===pos.y; });
  }
  function randomEmpty(snake, food, cols, rows, rng) {
    rng = rng || Math.random;
    var pos, attempts = 0;
    do {
      pos = { x: Math.floor(rng()*cols), y: Math.floor(rng()*rows) };
      if (++attempts > cols*rows*2) break;
    } while (onSnake(snake, pos) ||
             (food != null && pos.x===food.x && pos.y===food.y));
    return pos;
  }
  function applyDir(state, d) {
    if (d.x !== 0 && d.x === -state.dir.x) return state;
    if (d.y !== 0 && d.y === -state.dir.y) return state;
    return Object.assign({}, state, { nextDir: { x: d.x, y: d.y } });
  }
  function step(state, rng) {
    if (!state.running || state.paused)
      return Object.assign({}, state, { justAte: false });
    var cols=state.cols, rows=state.rows;
    var dir  = { x: state.nextDir.x, y: state.nextDir.y };
    var head = { x: state.snake[0].x+dir.x, y: state.snake[0].y+dir.y };
    if (head.x<0 || head.x>=cols || head.y<0 || head.y>=rows)
      return Object.assign({}, state, { running:false, dir:dir, justAte:false });
    var food = state.food;
    var willEat = food && head.x===food.x && head.y===food.y;
    var bodyToCheck = willEat ? state.snake : state.snake.slice(0,-1);
    if (bodyToCheck.some(function(s){ return s.x===head.x && s.y===head.y; }))
      return Object.assign({}, state, { running:false, dir:dir, justAte:false });
    var newSnake=[head].concat(state.snake), bonus=state.bonus,
        score=state.score, level=state.level, speed=state.speed, justAte=false;
    if (willEat) {
      score += 10*level; justAte = true;
      food = randomEmpty(newSnake, null, cols, rows, rng);
      if (score >= level*50*level) { level++; speed = Math.max(60, speed-15); }
    } else if (bonus && head.x===bonus.x && head.y===bonus.y) {
      score += 50*level; bonus = null; justAte = true;
    }
    var finalSnake = (justAte && willEat) ? newSnake : newSnake.slice(0,-1);
    return Object.assign({}, state,
      { snake:finalSnake, dir:dir, food:food, bonus:bonus,
        score:score, level:level, speed:speed, justAte:justAte });
  }
  exports.createState=createState; exports.onSnake=onSnake;
  exports.randomEmpty=randomEmpty; exports.applyDir=applyDir; exports.step=step;
})(typeof module!=='undefined' ? module.exports : (window.SnakeLogic=window.SnakeLogic||{}));
</script>

<script>
  // ── Constants ──────────────────────────────────────────────────────────────
  const COLS = 25;
  const ROWS = 25;

  // ── Canvas setup ───────────────────────────────────────────────────────────
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');

  function calcCell() {
    const maxW = Math.min(window.innerWidth  - 16, 600);
    const maxH = window.innerHeight - 240;
    return Math.max(Math.floor(Math.min(maxW, maxH) / COLS), 10);
  }

  let CELL = calcCell();

  function resizeCanvas() {
    CELL = calcCell();
    canvas.width  = COLS * CELL;
    canvas.height = ROWS * CELL;
    draw(); // safe — draw() guards against null state
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const scoreEl      = document.getElementById('score');
  const highScoreEl  = document.getElementById('high-score');
  const levelEl      = document.getElementById('level');
  const overlay      = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg   = document.getElementById('overlay-msg');
  const startBtn     = document.getElementById('start-btn');

  // ── Rendering colours ──────────────────────────────────────────────────────
  const COLORS = {
    bg:          '#16213e',
    gridLine:    '#1a2550',
    snakeHead:   '#4ecca3',
    snakeBody:   '#2ea87c',
    snakeBorder: '#38b892',
    food:        '#ff6b6b',
    foodGlow:    'rgba(255,107,107,0.4)',
    bonus:       '#ffd93d',
    bonusGlow:   'rgba(255,217,61,0.4)',
  };

  // ── Runtime state ──────────────────────────────────────────────────────────
  let state        = null;   // null until first game starts
  let highScore    = 0;
  let gameLoop     = null;
  let bonusTimeout = null;

  // ── Game lifecycle ─────────────────────────────────────────────────────────

  function startGame() {
    clearInterval(gameLoop);
    clearTimeout(bonusTimeout);
    bonusTimeout = null;

    state = SnakeLogic.createState(COLS, ROWS);
    // Place food in a random empty cell
    state = Object.assign({}, state, {
      food: SnakeLogic.randomEmpty(state.snake, null, COLS, ROWS),
    });

    overlay.style.display = 'none';
    updateHUD();
    draw();
    gameLoop = setInterval(tick, state.speed);
  }

  function tick() {
    if (!state || !state.running || state.paused) return;

    const prevSpeed = state.speed;
    state = SnakeLogic.step(state);

    if (!state.running) {
      gameOver();
      return;
    }

    // Restart the interval if the level-up changed the speed
    if (state.speed !== prevSpeed) {
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, state.speed);
    }

    // Randomly spawn a bonus item when food was just eaten
    if (state.justAte && !state.bonus && Math.random() < 0.2) {
      const bonusPos = SnakeLogic.randomEmpty(state.snake, state.food, COLS, ROWS);
      state = Object.assign({}, state, { bonus: bonusPos });
      clearTimeout(bonusTimeout);
      bonusTimeout = setTimeout(function () {
        if (state) state = Object.assign({}, state, { bonus: null });
        draw();
      }, 5000);
    }

    updateHUD();
    draw();
  }

  function gameOver() {
    clearInterval(gameLoop);
    clearTimeout(bonusTimeout);
    bonusTimeout = null;

    overlayTitle.textContent = 'GAME OVER';
    overlayMsg.textContent   = 'Score: ' + state.score;
    startBtn.textContent     = 'PLAY AGAIN';
    overlay.style.display    = 'flex';
  }

  function togglePause() {
    if (!state || !state.running) return;
    if (state.paused) {
      state = Object.assign({}, state, { paused: false });
      overlay.style.display = 'none';
      gameLoop = setInterval(tick, state.speed);
    } else {
      state = Object.assign({}, state, { paused: true });
      clearInterval(gameLoop);
      overlayTitle.textContent = 'PAUSED';
      overlayMsg.textContent   = 'Press P or tap Resume to continue';
      startBtn.textContent     = 'RESUME';
      overlay.style.display    = 'flex';
    }
  }

  function updateHUD() {
    if (!state) return;
    scoreEl.textContent = state.score;
    levelEl.textContent = state.level;
    if (state.score > highScore) {
      highScore = state.score;
      highScoreEl.textContent = highScore;
    }
  }

  // ── Rendering ──────────────────────────────────────────────────────────────

  function draw() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawGrid();

    // Nothing else to draw until the game starts
    if (!state) return;

    if (state.food)  drawCircle(state.food,  COLORS.food,  COLORS.foodGlow);
    if (state.bonus) drawCircle(state.bonus, COLORS.bonus, COLORS.bonusGlow);
    drawSnake();
  }

  function drawGrid() {
    ctx.strokeStyle = COLORS.gridLine;
    ctx.lineWidth   = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(canvas.width, y * CELL);
      ctx.stroke();
    }
  }

  function drawCircle(pos, color, glow) {
    const cx = pos.x * CELL + CELL / 2;
    const cy = pos.y * CELL + CELL / 2;
    const r  = CELL / 2 - 3;

    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r + 6);
    grad.addColorStop(0, glow);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake() {
    state.snake.forEach((seg, i) => {
      const x = seg.x * CELL + 1;
      const y = seg.y * CELL + 1;
      const s = CELL - 2;

      ctx.fillStyle   = i === 0 ? COLORS.snakeHead : COLORS.snakeBody;
      ctx.strokeStyle = COLORS.snakeBorder;
      ctx.lineWidth   = 1;
      roundRect(x, y, s, s, i === 0 ? 6 : 3);
      ctx.fill();
      ctx.stroke();

      if (i === 0) {
        ctx.fillStyle = '#1a1a2e';
        const ex = state.dir.x, ey = state.dir.y;
        const cx = seg.x * CELL + CELL / 2;
        const cy = seg.y * CELL + CELL / 2;
        ctx.beginPath();
        ctx.arc(cx + ex * 6 + ey * 4, cy + ey * 6 + ex * 4, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + ex * 6 - ey * 4, cy + ey * 6 - ex * 4, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ── Input ──────────────────────────────────────────────────────────────────

  function handleDir(d) {
    if (!state || !state.running || state.paused) return;
    state = SnakeLogic.applyDir(state, d);
  }

  const KEY_MAP = {
    ArrowUp:    { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    ArrowDown:  { x: 0, y:  1 }, s: { x: 0, y:  1 }, S: { x: 0, y:  1 },
    ArrowLeft:  { x:-1, y:  0 }, a: { x:-1, y:  0 }, A: { x:-1, y:  0 },
    ArrowRight: { x: 1, y:  0 }, d: { x: 1, y:  0 }, D: { x: 1, y:  0 },
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
    const d = KEY_MAP[e.key];
    if (!d) return;
    e.preventDefault();
    handleDir(d);
  });

  // Touch swipe on canvas
  let touchStart = null;

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    e.preventDefault();
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      handleDir(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
    } else {
      handleDir(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
    }
  }, { passive: false });

  // D-pad
  const DPAD_MAP = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };

  document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn => {
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      handleDir(DPAD_MAP[btn.dataset.dir]);
    }, { passive: false });
    btn.addEventListener('mousedown', () => handleDir(DPAD_MAP[btn.dataset.dir]));
  });

  document.getElementById('btn-pause').addEventListener('touchstart', e => {
    e.preventDefault();
    togglePause();
  }, { passive: false });
  document.getElementById('btn-pause').addEventListener('mousedown', togglePause);

  // Start / Resume button
  startBtn.addEventListener('click', () => {
    if (state && state.running && state.paused) {
      togglePause();
    } else {
      startBtn.textContent = 'PLAY AGAIN';
      startGame();
    }
  });

  // Update overlay hint based on pointer type
  if (window.matchMedia('(pointer: coarse)').matches) {
    overlayMsg.textContent = 'Swipe or use the D-pad to move';
  }

  // Initial render — draws the grid only (state is null, no snake/food yet)
  draw();
</script>
</body>
</html>
