<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Game</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snake">
  <meta name="theme-color" content="#4ecca3">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
      touch-action: none;
      overflow: hidden;
    }
    h1 {
      font-size: clamp(1.4rem, 5vw, 2.5rem);
      color: #4ecca3;
      margin-bottom: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    #scoreboard {
      display: flex;
      gap: clamp(12px, 4vw, 40px);
      margin-bottom: 10px;
      font-size: clamp(0.65rem, 2.5vw, 1rem);
      letter-spacing: 2px;
    }
    #scoreboard span  { color: #a0a0c0; }
    #scoreboard strong { color: #4ecca3; }
    #game-container { position: relative; }
    canvas {
      display: block;
      border: 2px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(78,204,163,0.3);
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(26,26,46,0.88);
      border-radius: 4px;
    }
    #overlay h2 {
      font-size: clamp(1.2rem, 5vw, 2rem);
      color: #4ecca3;
      margin-bottom: 8px;
      letter-spacing: 3px;
    }
    #overlay p {
      color: #a0a0c0;
      margin-bottom: 24px;
      font-size: clamp(0.7rem, 2.5vw, 0.9rem);
      text-align: center;
      padding: 0 16px;
    }
    #start-btn {
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      padding: 12px 32px;
      font-size: clamp(0.85rem, 3vw, 1rem);
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 4px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #start-btn:hover  { background: #38b892; }
    #start-btn:active { opacity: 0.8; }
    #controls {
      margin-top: 10px;
      font-size: 0.7rem;
      color: #606080;
      letter-spacing: 1px;
    }
    #dpad {
      display: none;
      margin-top: 16px;
      position: relative;
      width: 150px;
      height: 150px;
      flex-shrink: 0;
    }
    .dpad-btn {
      position: absolute;
      width: 46px; height: 46px;
      background: #1e2a4a;
      border: 2px solid #4ecca3;
      border-radius: 6px;
      color: #4ecca3;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .dpad-btn:active { background: #2a3f6a; }
    #btn-up    { top: 0;    left: 50%; transform: translateX(-50%); }
    #btn-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
    #btn-left  { left: 0;   top: 50%;  transform: translateY(-50%); }
    #btn-right { right: 0;  top: 50%;  transform: translateY(-50%); }
    #btn-pause {
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      font-size: 0.65rem;
      border-color: #606080;
      color: #606080;
      width: 38px; height: 38px;
    }
    @media (pointer: coarse) {
      #dpad     { display: flex; }
      #controls { display: none; }
    }
  </style>
</head>
<body>

<h1>Snake</h1>

<div id="scoreboard">
  <div><span>SCORE </span><strong id="score">0</strong></div>
  <div><span>BEST </span><strong id="high-score">0</strong></div>
  <div><span>LEVEL </span><strong id="level">1</strong></div>
</div>

<div id="game-container">
  <canvas id="canvas"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">SNAKE</h2>
    <p id="overlay-msg">Arrow keys or WASD to move</p>
    <button id="start-btn">PLAY</button>
  </div>
</div>

<div id="controls">ARROW KEYS / WASD &nbsp;|&nbsp; P = PAUSE</div>

<div id="dpad">
  <div class="dpad-btn" id="btn-up"    data-dir="up">▲</div>
  <div class="dpad-btn" id="btn-left"  data-dir="left">◀</div>
  <div class="dpad-btn" id="btn-pause">II</div>
  <div class="dpad-btn" id="btn-right" data-dir="right">▶</div>
  <div class="dpad-btn" id="btn-down"  data-dir="down">▼</div>
</div>

<script>
// ── Grid ──────────────────────────────────────────────────────────────────────
var COLS = 25, ROWS = 25;

// ── Canvas ────────────────────────────────────────────────────────────────────
var canvas = document.getElementById('canvas');
var ctx    = canvas.getContext('2d');
var CELL   = 10;

function calcCell() {
  var maxW = Math.min(window.innerWidth  - 16, 600);
  var maxH = window.innerHeight - 240;
  return Math.max(Math.floor(Math.min(maxW, maxH) / COLS), 10);
}

function resizeCanvas() {
  CELL = calcCell();
  canvas.width  = COLS * CELL;
  canvas.height = ROWS * CELL;
  draw();
}

// ── Colors ────────────────────────────────────────────────────────────────────
var C = {
  bg:    '#16213e', grid:   '#1a2550',
  head:  '#4ecca3', body:   '#2ea87c', border: '#38b892',
  food:  '#ff6b6b', fGlow:  'rgba(255,107,107,0.4)',
  bonus: '#ffd93d', bGlow:  'rgba(255,217,61,0.4)',
};

// ── Game state ────────────────────────────────────────────────────────────────
var snake, dir, nextDir, food, bonus;
var score, highScore, level, speed;
var running, paused;
var gameLoop, bonusTimer;
highScore = 0;

function initGame() {
  var cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
  snake   = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir     = {x:1,y:0};
  nextDir = {x:1,y:0};
  score   = 0;
  level   = 1;
  speed   = 150;
  bonus   = null;
  running = true;
  paused  = false;
  food    = randomEmpty(null);
  updateHUD();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function onSnake(pos) {
  for (var i = 0; i < snake.length; i++) {
    if (snake[i].x === pos.x && snake[i].y === pos.y) return true;
  }
  return false;
}

function randomEmpty(avoid) {
  var pos, tries = 0;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
    if (++tries > COLS*ROWS*2) break;
  } while (onSnake(pos) || (avoid && pos.x===avoid.x && pos.y===avoid.y));
  return pos;
}

// ── Game tick ─────────────────────────────────────────────────────────────────
function tick() {
  if (!running || paused) return;

  dir = {x: nextDir.x, y: nextDir.y};
  var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    endGame(); return;
  }

  // Self collision (exclude tail — it vacates this tick unless eating)
  var willEat = head.x === food.x && head.y === food.y;
  var limit   = willEat ? snake.length : snake.length - 1;
  for (var i = 0; i < limit; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) { endGame(); return; }
  }

  // Move
  snake.unshift(head);
  var ate = false;

  if (willEat) {
    score += 10 * level;
    ate = true;
    food = randomEmpty(null);
    if (score >= level * 50 * level) {
      level++;
      speed = Math.max(60, speed - 15);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }
    // Occasionally spawn a bonus item
    if (!bonus && Math.random() < 0.2) {
      bonus = randomEmpty(food);
      clearTimeout(bonusTimer);
      bonusTimer = setTimeout(function() { bonus = null; draw(); }, 5000);
    }
    updateHUD();
  } else if (bonus && head.x === bonus.x && head.y === bonus.y) {
    score += 50 * level;
    bonus  = null;
    ate    = true;
    clearTimeout(bonusTimer);
    updateHUD();
  }

  if (!ate) snake.pop();
  draw();
}

// ── Lifecycle ─────────────────────────────────────────────────────────────────
function startGame() {
  clearInterval(gameLoop);
  clearTimeout(bonusTimer);
  initGame();
  document.getElementById('overlay').style.display = 'none';
  draw();
  gameLoop = setInterval(tick, speed);
}

function endGame() {
  running = false;
  clearInterval(gameLoop);
  clearTimeout(bonusTimer);
  bonus = null;
  var ov = document.getElementById('overlay');
  document.getElementById('overlay-title').textContent = 'GAME OVER';
  document.getElementById('overlay-msg').textContent   = 'Score: ' + score;
  document.getElementById('start-btn').textContent     = 'PLAY AGAIN';
  ov.style.display = 'flex';
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  var ov = document.getElementById('overlay');
  if (paused) {
    clearInterval(gameLoop);
    document.getElementById('overlay-title').textContent = 'PAUSED';
    document.getElementById('overlay-msg').textContent   = 'Press P or tap Resume';
    document.getElementById('start-btn').textContent     = 'RESUME';
    ov.style.display = 'flex';
  } else {
    ov.style.display = 'none';
    gameLoop = setInterval(tick, speed);
  }
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  if (score > highScore) {
    highScore = score;
    document.getElementById('high-score').textContent = highScore;
  }
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function draw() {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = C.grid;
  ctx.lineWidth   = 0.5;
  for (var x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,canvas.height); ctx.stroke();
  }
  for (var y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width,y*CELL); ctx.stroke();
  }

  if (!running && !snake) return; // before first game
  if (!snake) return;

  // Food
  if (food)  drawDot(food,  C.food,  C.fGlow);
  if (bonus) drawDot(bonus, C.bonus, C.bGlow);

  // Snake
  for (var i = 0; i < snake.length; i++) {
    var seg = snake[i];
    var sx = seg.x*CELL+1, sy = seg.y*CELL+1, ss = CELL-2;
    ctx.fillStyle   = i === 0 ? C.head : C.body;
    ctx.strokeStyle = C.border;
    ctx.lineWidth   = 1;
    roundRect(sx, sy, ss, ss, i === 0 ? 6 : 3);
    ctx.fill(); ctx.stroke();
    if (i === 0) {
      ctx.fillStyle = C.bg;
      var ex = dir.x, ey = dir.y;
      var cx = seg.x*CELL + CELL/2, cy = seg.y*CELL + CELL/2;
      ctx.beginPath(); ctx.arc(cx+ex*6+ey*4, cy+ey*6+ex*4, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+ex*6-ey*4, cy+ey*6-ex*4, 2, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawDot(pos, color, glow) {
  var cx = pos.x*CELL+CELL/2, cy = pos.y*CELL+CELL/2, r = CELL/2-3;
  var g = ctx.createRadialGradient(cx,cy,0,cx,cy,r+6);
  g.addColorStop(0, glow); g.addColorStop(1,'transparent');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx,cy,r+6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ── Input ─────────────────────────────────────────────────────────────────────
var KEY_MAP = {
  ArrowUp:{x:0,y:-1}, w:{x:0,y:-1}, W:{x:0,y:-1},
  ArrowDown:{x:0,y:1}, s:{x:0,y:1}, S:{x:0,y:1},
  ArrowLeft:{x:-1,y:0}, a:{x:-1,y:0}, A:{x:-1,y:0},
  ArrowRight:{x:1,y:0}, d:{x:1,y:0}, D:{x:1,y:0},
};

document.addEventListener('keydown', function(e) {
  if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
  var d = KEY_MAP[e.key];
  if (!d) return;
  e.preventDefault();
  steer(d);
});

function steer(d) {
  if (!running || paused) return;
  if (d.x !== 0 && d.x === -dir.x) return;
  if (d.y !== 0 && d.y === -dir.y) return;
  nextDir = d;
}

// Touch swipe
var touchX, touchY;
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, {passive: false});
canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  var dx = e.changedTouches[0].clientX - touchX;
  var dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
  if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? {x:1,y:0} : {x:-1,y:0});
  else                              steer(dy > 0 ? {x:0,y:1} : {x:0,y:-1});
}, {passive: false});

// D-pad
var DPAD = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
var dpadBtns = document.querySelectorAll('.dpad-btn[data-dir]');
for (var b = 0; b < dpadBtns.length; b++) {
  (function(btn) {
    btn.addEventListener('touchstart', function(e) { e.preventDefault(); steer(DPAD[btn.dataset.dir]); }, {passive:false});
    btn.addEventListener('mousedown',  function()  { steer(DPAD[btn.dataset.dir]); });
  })(dpadBtns[b]);
}
document.getElementById('btn-pause').addEventListener('touchstart', function(e) { e.preventDefault(); togglePause(); }, {passive:false});
document.getElementById('btn-pause').addEventListener('mousedown', togglePause);

// Start / Resume button
document.getElementById('start-btn').addEventListener('click', function() {
  if (running && paused) {
    togglePause();
  } else {
    document.getElementById('start-btn').textContent = 'PLAY AGAIN';
    startGame();
  }
});

// Pointer hint
if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
  document.getElementById('overlay-msg').textContent = 'Swipe or use the D-pad to move';
}

// Boot
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Register service worker for offline / PWA support
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
