<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breakout</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    color: #eee;
  }
  #wrap {
    text-align: center;
  }
  canvas {
    background: #000;
    border: 2px solid #444;
    display: block;
    margin: 0 auto;
    max-width: 95vw;
    height: auto;
  }
  #status {
    margin-top: 12px;
    min-height: 24px;
    font-size: 18px;
    letter-spacing: 1px;
  }
  #hint {
    margin-top: 6px;
    font-size: 13px;
    color: #888;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="status"></div>
  <div id="hint">&larr; / &rarr; or A / D to move &middot; click/tap and drag also works &middot; Space to pause &middot; R to restart</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const PADDLE_WIDTH = 100;
const PADDLE_HEIGHT = 14;
const PADDLE_SPEED = 8;
const BALL_SIZE = 10;
const BALL_SPEED_START = 5.5;
const BALL_SPEED_MAX = 11;
const LIVES_START = 3;

const ROWS = 6;
const COLS = 10;
const BRICK_PAD = 4;
const BRICK_TOP = 60;
const BRICK_SIDE = 20;
const BRICK_WIDTH = (WIDTH - BRICK_SIDE * 2 - BRICK_PAD * (COLS - 1)) / COLS;
const BRICK_HEIGHT = 22;
const ROW_COLORS = ['#e94560', '#e9a944', '#e9e044', '#8ee944', '#44c9e9', '#a444e9'];
const ROW_POINTS = [60, 50, 40, 30, 20, 10];

let paddle, ball, bricks, keys, paused, gameOver, won, score, lives, level;
let dragging = false;

function buildBricks() {
  const arr = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      arr.push({
        x: BRICK_SIDE + c * (BRICK_WIDTH + BRICK_PAD),
        y: BRICK_TOP + r * (BRICK_HEIGHT + BRICK_PAD),
        row: r,
        alive: true
      });
    }
  }
  return arr;
}

function resetBall(stuckToPaddle) {
  ball = {
    x: paddle.x + paddle.width / 2,
    y: paddle.y - BALL_SIZE / 2 - 1,
    vx: 0,
    vy: 0,
    stuck: stuckToPaddle !== false
  };
}

function launchBall() {
  if (!ball.stuck) return;
  ball.stuck = false;
  const angle = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
  ball.vx = BALL_SPEED_START * Math.cos(angle);
  ball.vy = BALL_SPEED_START * Math.sin(angle);
}

function initGame() {
  paddle = { x: WIDTH / 2 - PADDLE_WIDTH / 2, y: HEIGHT - 40, width: PADDLE_WIDTH };
  bricks = buildBricks();
  keys = {};
  paused = false;
  gameOver = false;
  won = false;
  score = 0;
  lives = LIVES_START;
  level = 1;
  resetBall();
}

function nextLevel() {
  level++;
  bricks = buildBricks();
  paddle.x = WIDTH / 2 - PADDLE_WIDTH / 2;
  resetBall();
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ') {
    e.preventDefault();
    if (ball.stuck && !gameOver && !paused) launchBall();
    else if (!gameOver) paused = !paused;
  }
  if (k === 'r') initGame();
  if (['arrowleft', 'arrowright'].includes(k)) e.preventDefault();
});
document.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});

function canvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (WIDTH / rect.width);
}

canvas.addEventListener('mousedown', (e) => {
  dragging = true;
  if (ball.stuck && !gameOver && !paused) launchBall();
});
document.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mousemove', (e) => {
  if (gameOver || paused) return;
  paddle.x = clamp(canvasX(e.clientX) - paddle.width / 2, 0, WIDTH - paddle.width);
});
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (ball.stuck && !gameOver && !paused) launchBall();
  const t = e.touches[0];
  paddle.x = clamp(canvasX(t.clientX) - paddle.width / 2, 0, WIDTH - paddle.width);
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (gameOver || paused) return;
  const t = e.touches[0];
  paddle.x = clamp(canvasX(t.clientX) - paddle.width / 2, 0, WIDTH - paddle.width);
}, { passive: false });

function loseLife() {
  lives--;
  if (lives <= 0) {
    gameOver = true;
    won = false;
  } else {
    resetBall();
  }
}

function update() {
  if (paused || gameOver) return;

  if (keys['arrowleft'] || keys['a']) paddle.x -= PADDLE_SPEED;
  if (keys['arrowright'] || keys['d']) paddle.x += PADDLE_SPEED;
  paddle.x = clamp(paddle.x, 0, WIDTH - paddle.width);

  if (ball.stuck) {
    ball.x = paddle.x + paddle.width / 2;
    ball.y = paddle.y - BALL_SIZE / 2 - 1;
    return;
  }

  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.x - BALL_SIZE / 2 <= 0) {
    ball.x = BALL_SIZE / 2;
    ball.vx *= -1;
  } else if (ball.x + BALL_SIZE / 2 >= WIDTH) {
    ball.x = WIDTH - BALL_SIZE / 2;
    ball.vx *= -1;
  }
  if (ball.y - BALL_SIZE / 2 <= 0) {
    ball.y = BALL_SIZE / 2;
    ball.vy *= -1;
  }

  if (ball.vy > 0 &&
      ball.y + BALL_SIZE / 2 >= paddle.y &&
      ball.y + BALL_SIZE / 2 <= paddle.y + PADDLE_HEIGHT + 6 &&
      ball.x >= paddle.x &&
      ball.x <= paddle.x + paddle.width) {
    const relativeIntersect = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
    const bounceAngle = relativeIntersect * (Math.PI / 3);
    const speed = clamp(Math.hypot(ball.vx, ball.vy) * 1.02, BALL_SPEED_START, BALL_SPEED_MAX);
    ball.vx = speed * Math.sin(bounceAngle);
    ball.vy = -speed * Math.cos(bounceAngle);
    ball.y = paddle.y - BALL_SIZE / 2 - 1;
  }

  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + BALL_SIZE / 2 >= b.x &&
        ball.x - BALL_SIZE / 2 <= b.x + BRICK_WIDTH &&
        ball.y + BALL_SIZE / 2 >= b.y &&
        ball.y - BALL_SIZE / 2 <= b.y + BRICK_HEIGHT) {
      b.alive = false;
      score += ROW_POINTS[b.row];

      const overlapLeft = (ball.x + BALL_SIZE / 2) - b.x;
      const overlapRight = (b.x + BRICK_WIDTH) - (ball.x - BALL_SIZE / 2);
      const overlapTop = (ball.y + BALL_SIZE / 2) - b.y;
      const overlapBottom = (b.y + BRICK_HEIGHT) - (ball.y - BALL_SIZE / 2);
      const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
      if (minOverlap === overlapLeft || minOverlap === overlapRight) ball.vx *= -1;
      else ball.vy *= -1;
      break;
    }
  }

  if (ball.y - BALL_SIZE / 2 > HEIGHT) {
    loseLife();
    return;
  }

  if (bricks.every((b) => !b.alive)) {
    if (level >= 3) {
      gameOver = true;
      won = true;
    } else {
      nextLevel();
    }
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = ROW_COLORS[b.row];
    ctx.fillRect(b.x, b.y, BRICK_WIDTH, BRICK_HEIGHT);
  }

  ctx.fillStyle = '#eee';
  ctx.fillRect(paddle.x, paddle.y, paddle.width, PADDLE_HEIGHT);

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_SIZE / 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = '18px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 16, 28);
  ctx.textAlign = 'center';
  ctx.fillText('Level ' + level, WIDTH / 2, 28);
  ctx.textAlign = 'right';
  ctx.fillText('Lives: ' + lives, WIDTH - 16, 28);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '36px "Courier New", monospace';
    ctx.fillText(won ? 'You win!' : 'Game over', WIDTH / 2, HEIGHT / 2 - 10);
    ctx.font = '18px "Courier New", monospace';
    ctx.fillText('Score: ' + score + '  ·  Press R to play again', WIDTH / 2, HEIGHT / 2 + 30);
  } else if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '30px "Courier New", monospace';
    ctx.fillText('Paused', WIDTH / 2, HEIGHT / 2);
  } else if (ball.stuck) {
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'center';
    ctx.font = '16px "Courier New", monospace';
    ctx.fillText('Space or click to launch', WIDTH / 2, HEIGHT / 2);
  }

  statusEl.textContent = '';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
</html>
