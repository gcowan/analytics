<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pong</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    color: #eee;
  }
  #wrap {
    text-align: center;
  }
  canvas {
    background: #000;
    border: 2px solid #444;
    display: block;
    margin: 0 auto;
  }
  #status {
    margin-top: 12px;
    min-height: 24px;
    font-size: 18px;
    letter-spacing: 1px;
  }
  #hint {
    margin-top: 6px;
    font-size: 13px;
    color: #888;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="500"></canvas>
  <div id="status"></div>
  <div id="hint">W / S or &uarr; / &darr; to move &middot; Space to pause &middot; R to restart</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const WIN_SCORE = 11;

const PADDLE_WIDTH = 12;
const PADDLE_HEIGHT = 90;
const PADDLE_SPEED = 6.5;
const BALL_SIZE = 10;
const BALL_SPEED_START = 5;
const BALL_SPEED_MAX = 13;
const AI_SPEED = 4.2;
const AI_ERROR = 35;

let player, ai, ball, keys, paused, gameOver, winner;

function initGame() {
  player = { x: 30, y: HEIGHT / 2 - PADDLE_HEIGHT / 2, score: 0 };
  ai = { x: WIDTH - 30 - PADDLE_WIDTH, y: HEIGHT / 2 - PADDLE_HEIGHT / 2, score: 0, error: 0, wasApproaching: false };
  keys = {};
  paused = false;
  gameOver = false;
  winner = null;
  resetBall(Math.random() < 0.5 ? 1 : -1);
}

function resetBall(direction) {
  const angle = (Math.random() * 0.6 - 0.3);
  ball = {
    x: WIDTH / 2,
    y: HEIGHT / 2,
    vx: BALL_SPEED_START * direction,
    vy: BALL_SPEED_START * Math.sin(angle)
  };
}

document.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') {
    e.preventDefault();
    if (!gameOver) paused = !paused;
  }
  if (e.key.toLowerCase() === 'r') {
    initGame();
  }
  if (['arrowup', 'arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function update() {
  if (paused || gameOver) return;

  if (keys['w'] || keys['arrowup']) player.y -= PADDLE_SPEED;
  if (keys['s'] || keys['arrowdown']) player.y += PADDLE_SPEED;
  player.y = clamp(player.y, 0, HEIGHT - PADDLE_HEIGHT);

  const approaching = ball.vx > 0;
  if (approaching && !ai.wasApproaching) {
    ai.error = (Math.random() * 2 - 1) * AI_ERROR;
  }
  ai.wasApproaching = approaching;

  const aiCenter = ai.y + PADDLE_HEIGHT / 2;
  const targetY = approaching ? ball.y + ai.error : HEIGHT / 2;
  if (aiCenter < targetY - 10) ai.y += AI_SPEED;
  else if (aiCenter > targetY + 10) ai.y -= AI_SPEED;
  ai.y = clamp(ai.y, 0, HEIGHT - PADDLE_HEIGHT);

  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.y - BALL_SIZE / 2 <= 0) {
    ball.y = BALL_SIZE / 2;
    ball.vy *= -1;
  } else if (ball.y + BALL_SIZE / 2 >= HEIGHT) {
    ball.y = HEIGHT - BALL_SIZE / 2;
    ball.vy *= -1;
  }

  if (ball.vx < 0 &&
      ball.x - BALL_SIZE / 2 <= player.x + PADDLE_WIDTH &&
      ball.x - BALL_SIZE / 2 >= player.x &&
      ball.y >= player.y &&
      ball.y <= player.y + PADDLE_HEIGHT) {
    bounceOffPaddle(player);
  }

  if (ball.vx > 0 &&
      ball.x + BALL_SIZE / 2 >= ai.x &&
      ball.x + BALL_SIZE / 2 <= ai.x + PADDLE_WIDTH &&
      ball.y >= ai.y &&
      ball.y <= ai.y + PADDLE_HEIGHT) {
    bounceOffPaddle(ai);
  }

  if (ball.x < 0) {
    ai.score++;
    checkWin();
    if (!gameOver) resetBall(1);
  } else if (ball.x > WIDTH) {
    player.score++;
    checkWin();
    if (!gameOver) resetBall(-1);
  }
}

function bounceOffPaddle(paddle) {
  const relativeIntersect = (ball.y - (paddle.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
  const bounceAngle = relativeIntersect * (Math.PI / 3);
  const speed = clamp(Math.hypot(ball.vx, ball.vy) * 1.05, BALL_SPEED_START, BALL_SPEED_MAX);
  const direction = paddle === player ? 1 : -1;
  ball.vx = direction * speed * Math.cos(bounceAngle);
  ball.vy = speed * Math.sin(bounceAngle);
  ball.x = paddle === player ? paddle.x + PADDLE_WIDTH + BALL_SIZE / 2 : paddle.x - BALL_SIZE / 2;
}

function checkWin() {
  if (player.score >= WIN_SCORE) {
    gameOver = true;
    winner = 'You win!';
  } else if (ai.score >= WIN_SCORE) {
    gameOver = true;
    winner = 'Computer wins!';
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  ctx.strokeStyle = '#333';
  ctx.setLineDash([8, 10]);
  ctx.beginPath();
  ctx.moveTo(WIDTH / 2, 0);
  ctx.lineTo(WIDTH / 2, HEIGHT);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#eee';
  ctx.fillRect(player.x, player.y, PADDLE_WIDTH, PADDLE_HEIGHT);
  ctx.fillRect(ai.x, ai.y, PADDLE_WIDTH, PADDLE_HEIGHT);

  ctx.fillRect(ball.x - BALL_SIZE / 2, ball.y - BALL_SIZE / 2, BALL_SIZE, BALL_SIZE);

  ctx.font = '48px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(player.score, WIDTH / 2 - 60, 60);
  ctx.fillText(ai.score, WIDTH / 2 + 60, 60);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#fff';
    ctx.font = '36px "Courier New", monospace';
    ctx.fillText(winner, WIDTH / 2, HEIGHT / 2 - 10);
    ctx.font = '18px "Courier New", monospace';
    ctx.fillText('Press R to play again', WIDTH / 2, HEIGHT / 2 + 30);
  } else if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#fff';
    ctx.font = '30px "Courier New", monospace';
    ctx.fillText('Paused', WIDTH / 2, HEIGHT / 2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
</html>
